name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job definition, run three times in parallel by the matrix: "Unit Tests"
  # and the UI tests split into two shards. Each instance gets its own runner and
  # simulator, so the fast unit tests report in a few minutes while the slow UI
  # tests are still running, and a failure in one doesn't hide the result of the
  # others (fail-fast: false). The matrix keeps the shared steps (Xcode,
  # simulator, build) in one place; only the tests to run and the artifact differ.
  #
  # Why two UI shards: the UI tests alone take ~32 min on a fast local Mac and
  # a hosted runner is slower, so one UI job would hit timeout-minutes. The
  # shards are split by test class and balanced by measured time (~16 min each
  # locally). A new UI test class must be added to one of the two lists below,
  # otherwise it doesn't run in CI.
  test:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit Tests
            only-testing: -only-testing:Project2Tests
            artifact: UnitTestResults
          - name: UI Tests (1/2)
            only-testing: >-
              -only-testing:Project2UITests/ListDetailUITests
              -only-testing:Project2UITests/HomeUITests
              -only-testing:Project2UITests/SettingsUITests
            artifact: UITestResults-1
          - name: UI Tests (2/2)
            only-testing: >-
              -only-testing:Project2UITests/PlannerUITests
              -only-testing:Project2UITests/InlineAddUITests
              -only-testing:Project2UITests/ItemDetailsUITests
              -only-testing:Project2UITests/ListInfoUITests
            artifact: UITestResults-2
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pick iPhone simulator
        id: sim
        run: |
          # Newest available iOS runtime, first iPhone device on it.
          UDID=$(xcrun simctl list devices available --json | jq -r '
            .devices | to_entries
            | map(select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))
            | sort_by(.key | sub(".*iOS-"; "") | split("-") | map(tonumber))
            | reverse
            | map(.value[] | select(.name | startswith("iPhone")))
            | first | .udid // empty')
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Project2.xcodeproj \
            -scheme Project2 \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Test (${{ matrix.name }})
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Project2.xcodeproj \
            -scheme Project2 \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            ${{ matrix.only-testing }} \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: TestResults.xcresult
