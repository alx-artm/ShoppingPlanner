name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job definition, run twice in parallel by the matrix: "Unit Tests" and
  # "UI Tests". Each instance gets its own runner and simulator, so the fast unit
  # tests report in a few minutes while the slow UI tests are still running, and
  # a failure in one doesn't hide the result of the other (fail-fast: false).
  # The matrix keeps the shared steps (Xcode, simulator, build) in one place;
  # only the test target and the artifact name differ.
  test:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit Tests
            target: Project2Tests
            artifact: UnitTestResults
          - name: UI Tests
            target: Project2UITests
            artifact: UITestResults
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pick iPhone simulator
        id: sim
        run: |
          # Newest available iOS runtime, first iPhone device on it.
          UDID=$(xcrun simctl list devices available --json | jq -r '
            .devices | to_entries
            | map(select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))
            | sort_by(.key | sub(".*iOS-"; "") | split("-") | map(tonumber))
            | reverse
            | map(.value[] | select(.name | startswith("iPhone")))
            | first | .udid // empty')
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Project2.xcodeproj \
            -scheme Project2 \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Test (${{ matrix.target }})
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Project2.xcodeproj \
            -scheme Project2 \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -only-testing:${{ matrix.target }} \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: TestResults.xcresult
