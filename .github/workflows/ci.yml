name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job definition, run four times in parallel by the matrix: "Unit Tests",
  # the iPhone UI tests split into two shards, and a small iPad UI job. Each instance gets its own runner and
  # simulator, so the fast unit tests report in a few minutes while the slow UI
  # tests are still running, and a failure in one doesn't hide the result of the
  # others (fail-fast: false). The matrix keeps the shared steps (Xcode,
  # simulator, build) in one place; only the tests to run and the artifact differ.
  #
  # Why two UI shards: the UI tests alone take ~32 min on a fast local Mac and
  # a hosted runner is slower, so one UI job would hit timeout-minutes. The
  # shards are split by test class and balanced by measured time (~16 min each
  # locally). A new UI test class must be added to one of the two lists below,
  # otherwise it doesn't run in CI.
  #
  # Why a small iPad job: iPad has its own system behaviour (number pad in a
  # popover, hardware-keyboard mode, form sheets, keyboard shortcuts) that the
  # iPhone never shows. It runs only the classes that touch it, not the whole
  # suite, which would double CI time. iPad-only classes (KeyboardShortcutsUITests)
  # skip themselves on iPhone, so they are listed only here.
  test:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit Tests
            device: iPhone 17 Pro
            only-testing: -only-testing:Project2Tests
            artifact: UnitTestResults
          - name: UI Tests (1/2)
            device: iPhone 17 Pro
            only-testing: >-
              -only-testing:Project2UITests/ListDetailUITests
              -only-testing:Project2UITests/HomeUITests
              -only-testing:Project2UITests/SettingsUITests
            artifact: UITestResults-1
          - name: UI Tests (2/2)
            device: iPhone 17 Pro
            only-testing: >-
              -only-testing:Project2UITests/PlannerUITests
              -only-testing:Project2UITests/InlineAddUITests
              -only-testing:Project2UITests/ItemDetailsUITests
              -only-testing:Project2UITests/ListInfoUITests
            artifact: UITestResults-2
          - name: UI Tests (iPad)
            device: iPad Air 11-inch (M4)
            only-testing: >-
              -only-testing:Project2UITests/InlineAddUITests
              -only-testing:Project2UITests/ItemDetailsUITests
              -only-testing:Project2UITests/KeyboardShortcutsUITests
            artifact: UITestResults-iPad
    steps:
      - uses: actions/checkout@v7

      # Xcode stays "latest": a new Xcode can still run the pinned iOS 26.5
      # simulator below, and the build catches new compiler warnings early.
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pick iPhone simulator
        id: sim
        env:
          # Pinned, not "newest": otherwise the device and iOS version change
          # whenever GitHub updates the runner image, and tests can turn red with
          # no change in our code. Reproduce locally on the same pair (see
          # LESSONS.md, lesson 17). The device comes from the matrix (iPhone or
          # iPad). To move to a newer iOS, change SIM_RUNTIME in a separate PR
          # and run the whole suite.
          SIM_DEVICE: ${{ matrix.device }}
          SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
        run: |
          if ! xcrun simctl list runtimes --json | jq -e --arg r "$SIM_RUNTIME" \
              '.runtimes[] | select(.identifier == $r and .isAvailable)' > /dev/null; then
            echo "::error::Runtime $SIM_RUNTIME is not on this runner image. Update SIM_RUNTIME in ci.yml."
            xcrun simctl list runtimes
            exit 1
          fi
          UDID=$(xcrun simctl list devices available --json | jq -r \
            --arg r "$SIM_RUNTIME" --arg d "$SIM_DEVICE" \
            '.devices[$r] // [] | map(select(.name == $d)) | first | .udid // empty')
          if [ -z "$UDID" ]; then
            # The runtime is there but the image has no such device: create it.
            DEVICE_TYPE=$(xcrun simctl list devicetypes --json | jq -r --arg d "$SIM_DEVICE" \
              '.devicetypes[] | select(.name == $d) | .identifier')
            if [ -z "$DEVICE_TYPE" ]; then
              echo "::error::Device type \"$SIM_DEVICE\" is not known to this Xcode. Update SIM_DEVICE in ci.yml."
              exit 1
            fi
            UDID=$(xcrun simctl create "$SIM_DEVICE" "$DEVICE_TYPE" "$SIM_RUNTIME")
          fi
          xcrun simctl list devices | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Prepare simulator keyboard
        run: |
          # A fresh simulator shows the one-time "Slide to Type" introduction over the
          # keyboard the first time it appears. It swallows taps and keys (CI lost letters
          # and the inline Done tap in InlineAddUITests). Mark it as already shown: the
          # same flag the keyboard writes after showing it (found by diffing a simulator's
          # preferences before and after the introduction).
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Project2.xcodeproj \
            -scheme Project2 \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Test (${{ matrix.name }})
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Project2.xcodeproj \
            -scheme Project2 \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            ${{ matrix.only-testing }} \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: TestResults.xcresult
